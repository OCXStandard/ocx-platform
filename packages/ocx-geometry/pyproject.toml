[project]
name = "ocx-geometry"
version = "0.1.0"
description = "Geometry evaluation kernel for the OCX IR — lengths, areas, closure, tessellation (no display stack)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ocx-model-core>=0.5,<0.6",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocx_geometry"]

[tool.uv.sources]
ocx-model-core = { workspace = true }
