[project]
name = "ocx-geometry"
version = "0.2.0"
description = "Geometry evaluation kernel for the OCX IR — curves, surfaces, lengths, areas, closure (no tessellation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ocx-model-core>=0.5,<0.6",
    "numpy>=2.0",
    "geomdl>=5.4.0",
    "shapely>=2.2.0",
    "mapbox-earcut>=2.1.0",
    "loguru>=0.7",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocx_geometry"]

[tool.uv.sources]
ocx-model-core = { workspace = true }
