[project]
name = "ocx-model-core"
version = "0.5.0"
description = "Parse OCX .3docx ship model files into a schema-neutral IR, with offline XSD validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ocx>=3.2.0",
    "xsdata[lxml]>=26.0",
    "lxml>=6.0",
    "loguru>=0.7",
    "packaging>=23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocx_model_core"]
