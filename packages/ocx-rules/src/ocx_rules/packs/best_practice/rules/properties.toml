# Mass/property consistency rules

[[rule]]
id          = "OCX-PROP-001"
title       = "Plate weight consistent"
description = "Plate weight must equal surface area x thickness x material density within tolerance, after all cuts and splits."
source      = "property_validation"
category    = "properties"
severity    = "warning"
requires    = ["ir", "geometry"]
[rule.check]
custom             = "ocx_rules.packs.best_practice.checks:plate_weight_consistent"
relative_tolerance = 0.02

[[rule]]
id          = "OCX-PROP-002"
title       = "Panel weight/CoG consistent"
description = "Panel declared weight and centre of gravity cover the complete panel and must reconcile with the sum of all children parented to it: plates, stiffeners, edge reinforcements, brackets and pillars."
source      = "property_validation"
category    = "properties"
severity    = "warning"
requires    = ["ir", "geometry"]
[rule.check]
custom             = "ocx_rules.packs.best_practice.checks:panel_weight_cog_consistent"
relative_tolerance = 0.02
cog_tolerance_mm   = 50.0

[[rule]]
id          = "OCX-PROP-003"
title       = "Profile parameters close"
description = "Profile parameters (e.g. bulb flat) must reproduce a closed cross-section contour."
source      = "bulbflatparameters"
category    = "properties"
severity    = "error"
requires    = ["ir", "geometry"]
[rule.check]
custom = "ocx_rules.packs.best_practice.checks:profile_closed_section"

[[rule]]
id          = "OCX-PROP-004"
title       = "Renewal thickness on instance"
description = "Renewal thickness must be assigned to the individual part instance, not only to a shared definition."
source      = "renewal_thickness"
category    = "properties"
severity    = "error"
requires    = ["ir", "xml"]
# RenewalThickness exists only in the 3.2.0+ schemas; on older schemas the
# rule would silently pass, so it is skipped there instead.
schemas     = ["3.2", "3.3"]
[rule.check]
custom = "ocx_rules.packs.best_practice.checks:renewal_thickness_on_instance"

[[rule]]
id          = "OCX-PROP-005"
title       = "Part COG within part geometry"
description = "A plate/stiffener/pillar MouldedCOG must lie within the bounding box of the part's geometry (contour or trace) inflated by a margin."
source      = "mass_properties"
category    = "properties"
severity    = "warning"
requires    = ["ir", "geometry"]
[rule.check]
custom    = "ocx_rules.packs.best_practice.checks:part_cog_within_geometry"
margin_mm = 500.0

[[rule]]
id          = "OCX-PROP-006"
title       = "Position/COG not shared across parts"
description = "Inclination positions and MouldedCOGs must not be identical across many parts (typical exporter copy bug)."
source      = "mass_properties"
category    = "properties"
severity    = "warning"
requires    = ["ir", "geometry"]
[rule.check]
custom       = "ocx_rules.packs.best_practice.checks:shared_positions_and_cogs"
tolerance_mm = 1.0
min_parts    = 3
