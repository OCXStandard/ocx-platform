name: Publish to PyPI

on:
  push:
    tags: ["v*"]

env:
  # Workspace members published by a tag. Each needs a (pending) trusted
  # publisher in the 3docx.org PyPI organisation. Staged rollout: add
  # ocx-integrity and ocx-model-validator once these three are on PyPI.
  PUBLISH_PACKAGES: ocx-model-core ocx-geometry ocx-rules

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          uv sync --dev
          uv run pytest
      - name: Build sdist and wheel
        run: |
          for p in $PUBLISH_PACKAGES; do
            uv build --package "$p" -o dist
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/org/3docx.org/
    permissions:
      id-token: write  # PyPI trusted publishing (no API token needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A tag may not bump every package; don't fail on versions already uploaded.
          skip-existing: true
