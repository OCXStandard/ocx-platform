name: Publish to PyPI

on:
  push:
    tags: ["v*"]

env:
  # Workspace members published by a tag. Each needs a (pending) trusted
  # publisher in the 3docx.org PyPI organisation with environment
  # "pypi-<package>" — PyPI allows only one pending publisher per
  # (repo, workflow, environment), so packages cannot share an environment.
  PUBLISH_PACKAGES: ocx-model-core ocx-geometry ocx-rules ocx-integrity ocx-model-validator

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.json }}
    steps:
      - id: packages
        run: echo "json=$(jq -cn --arg p "$PUBLISH_PACKAGES" '$p | split(" ")')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          uv sync --dev
          uv run pytest
      - name: Build sdist and wheel
        run: |
          for p in $PUBLISH_PACKAGES; do
            uv build --package "$p" -o "dist/$p"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*/*.whl
            dist/*/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.build.outputs.packages) }}
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write  # PyPI trusted publishing (no API token needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}/
          # A tag may not bump every package; don't fail on versions already uploaded.
          skip-existing: true
